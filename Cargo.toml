[package]
name = "u-numflow"
version = "0.6.1"
rust-version = "1.85"
edition = "2021"
authors = ["iyulab"]
license = "MIT"
description = "Foundational mathematical primitives: statistics, probability distributions, random sampling, and collections."
repository = "https://github.com/iyulab/u-numflow"
keywords = ["statistics", "probability", "optimization", "mathematics"]
categories = ["mathematics", "science"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:serde", "dep:serde-wasm-bindgen"]

[dependencies]
rand = "0.10"
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
proptest = "1.4"

# `getrandom` is named nowhere in the source: it is declared only to turn on its
# `wasm_js` backend for wasm32, which `rand` needs to build there.
[package.metadata.cargo-machete]
ignored = ["getrandom"]
