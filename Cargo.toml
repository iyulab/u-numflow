[package]
name = "u-numflow"
version = "0.9.0"
rust-version = "1.85"
edition = "2021"
authors = ["iyulab"]
license = "MIT"
description = "Foundational mathematical primitives: statistics, probability distributions, random sampling, and collections."
repository = "https://github.com/iyulab/u-numflow"
keywords = ["statistics", "probability", "optimization", "mathematics"]
categories = ["mathematics", "science"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:serde", "dep:serde-wasm-bindgen", "dep:tsify"]
# C ABI (JSON in, JSON out) for the .NET binding in bindings/csharp.
ffi = ["dep:serde", "dep:serde_json", "dep:libc"]

[dependencies]
rand = "0.10"
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# Derives the TypeScript declaration from the same struct serde reads, so the
# published .d.ts cannot drift from the shape the binding actually returns.
tsify = { version = "0.5", default-features = false, features = ["js"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }
serde_json = { version = "1.0", optional = true, features = ["float_roundtrip"] }
libc = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
proptest = "1.4"
serde_json = "1.0"

# `getrandom` is named nowhere in the source: it is declared only to turn on its
# `wasm_js` backend for wasm32, which `rand` needs to build there.
[package.metadata.cargo-machete]
ignored = ["getrandom"]
