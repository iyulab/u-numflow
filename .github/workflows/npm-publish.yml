name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'src/wasm.rs'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false

      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          # Not 'latest': the action resolves that at run time and silently falls
          # back to v0.9.1 when the lookup fails, which predates `--features` and
          # fails the build below. Two runs three minutes apart got v0.15.0 and
          # v0.9.1 from the same pinned action.
          version: 'v0.15.0'

      - name: Build WASM package (bundler + nodejs)
        run: |
          wasm-pack build --target bundler --scope iyulab --out-dir pkg --features wasm
          wasm-pack build --target nodejs --scope iyulab --out-dir pkg-node --features wasm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Merge nodejs target (node-compatible entry via exports map)
        run: |
          NAME=$(node -p "require('./pkg/package.json').main.slice(0,-3)")
          mkdir -p pkg/node
          cp "pkg-node/${NAME}.js" "pkg/node/${NAME}.cjs"
          cp "pkg-node/${NAME}_bg.wasm" pkg/node/
          cp "pkg-node/${NAME}.d.ts" "pkg/node/${NAME}.d.cts"
          sed -i "s|@ts-self-types=\"./${NAME}.d.ts\"|@ts-self-types=\"./${NAME}.d.cts\"|" "pkg/node/${NAME}.cjs"
          node <<'EOF'
          const fs = require("fs");
          const p = JSON.parse(fs.readFileSync("pkg/package.json", "utf8"));
          const n = p.main.slice(0, -3);
          p.exports = { ".": {
            node: { types: `./node/${n}.d.cts`, default: `./node/${n}.cjs` },
            types: `./${n}.d.ts`,
            default: `./${n}.js`,
          } };
          p.exports["./package.json"] = "./package.json";
          if (!p.files.includes("node")) p.files.push("node");
          p.sideEffects = [...(p.sideEffects || []), `./node/${n}.cjs`];
          fs.writeFileSync("pkg/package.json", JSON.stringify(p, null, 2) + "\n");
          EOF

      - name: Node smoke test (CJS require + ESM import)
        run: |
          PKG_NAME=$(node -p "require('./pkg/package.json').name")
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/pkg"
          node -e "const m = require('$PKG_NAME'); if (!Object.keys(m).length) throw new Error('empty CJS exports')"
          node --input-type=module -e "import('$PKG_NAME').then(m => { if (!Object.keys(m).length) throw new Error('empty ESM exports') })"

      - name: Binding behaviour gate
        run: |
          PKG_NAME=$(node -p "require('./pkg/package.json').name")
          cd "$RUNNER_TEMP/smoke"
          cat > gate.mjs <<'EOF'
          import { createRequire } from 'node:module'
          const require = createRequire(import.meta.url)
          const m = require(process.env.PKG_NAME)
          const ok = (c, msg) => { if (!c) { console.error('FAIL: ' + msg); process.exit(1) } }

          // A sample inside a 0.1 % band with a short upper tail: the profile
          // likelihood is monotone across any symmetric range, so the estimate
          // belongs on the lower end of it and must say so. Computed from the
          // unnormalised transform the likelihood is instead noise at the 1e-5
          // level, and the search settles just inside the bound and calls that
          // an interior optimum -- which is what a caller cannot tell apart.
          const narrow = Array.from({ length: 57 }, (_, i) => 25 + ((i * 7) % 13 - 6) * 0.002)
            .concat([25.021, 25.023, 25.025])
          for (const [lo, hi] of [[-5, 5], [-20, 20]]) {
            const e = m.estimate_lambda(narrow, lo, hi)
            ok(e.at_bound === true, `estimate_lambda(narrow, ${lo}, ${hi}).at_bound=${e.at_bound}`)
            ok(e.lambda === lo, `estimate_lambda(narrow, ${lo}, ${hi}).lambda=${e.lambda}`)
          }

          // An interior optimum stays interior: the endpoint comparison must
          // not turn every estimate into a bound.
          const expo = Array.from({ length: 30 }, (_, i) => Math.exp((i + 1) * 0.2))
          const e = m.estimate_lambda(expo, -2, 2)
          ok(e.at_bound === false, `exponential sample reported at_bound=${e.at_bound}`)
          ok(Math.abs(e.lambda) < 0.3, `exponential sample lambda=${e.lambda}`)

          // box_cox keeps its meaning where the old expression could still read it.
          const bc = m.box_cox([1, Math.E], 0)
          ok(Math.abs(bc[0]) < 1e-12 && Math.abs(bc[1] - 1) < 1e-9, `box_cox lambda=0 gave ${bc}`)

          console.log('binding behaviour gate: ok')
          EOF
          PKG_NAME="$PKG_NAME" node gate.mjs

      - name: Publish to npm
        run: |
          cd pkg
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version 2>/dev/null; then
            echo "Version ${PKG_VER} already published, skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
